# Runs the full library build on every pull request and on main. Branch protection on main
# requires the "build" job, so a failing check blocks the merge.
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Build and check
        run: node tools/build.mjs all
      # The build rewrites examples/, library/directions.json and the bundled skill script.
      # Any difference means a source was changed without rebuilding.
      - name: Committed output matches the build
        run: git diff --exit-code
